[project]
name = "bridgic-llms-litellm"
version = "0.1.0"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
description = "LiteLLM adapters for Bridgic, enabling connectivity with 100+ LLM providers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "RheagalFire", email = "arishalam121@gmail.com" },
]
dependencies = [
    "bridgic-core>=0.3.0",
    "litellm>=1.80.0,<1.87",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=short", "--verbose"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["bridgic/"]

[tool.uv.sources]
bridgic-core = { workspace = true }
