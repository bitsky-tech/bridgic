[project]
name = "bridgic-amphibious"
version = "0.2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
description = "Dual-mode agent orchestration for LLM-driven agents and deterministic workflows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Tielei Zhang", email = "zhangtl04@gmail.com" },
]
dependencies = [
    "bridgic-core>=0.3.0",
    "pydantic>=2.11.0,<2.12.0",
    "pyyaml>=6.0.3",
    "fastmcp>=2.13.0",
    "mcp>=1.24.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
bridgic-amphibious = "bridgic.amphibious.scaffold:cli"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=short", "--verbose"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["bridgic/"]

[tool.uv.sources]
bridgic-core = { workspace = true }
